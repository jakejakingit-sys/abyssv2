name: build

on:
  push:
  pull_request:
  workflow_dispatch:

defaults:
  run:
    working-directory: abyss

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run host tests
        run: make -f Makefile.host

  calculator-build:
    runs-on: ubuntu-latest
    needs: host-tests
    steps:
      - uses: actions/checkout@v4

      - name: Install CEdev
        run: |
          curl -fL -o "$HOME/cedev.tar.gz" \
            https://github.com/CE-Programming/toolchain/releases/latest/download/CEdev-Linux.tar.gz
          tar -xzf "$HOME/cedev.tar.gz" -C "$HOME"
          ls "$HOME/CEdev" "$HOME/CEdev/bin"
          echo "CEDEV=$HOME/CEdev" >> "$GITHUB_ENV"
          echo "$HOME/CEdev/bin" >> "$GITHUB_PATH"

      - name: Show toolchain
        run: cedev-config --makefile

      - name: Build program
        run: make

      - name: Build asset AppVars
        run: make appvars

      - name: Check output
        run: |
          test -s bin/ABYSS.8xp
          for f in ABYSSCOR ABYSSBOS ABYSSLV1 ABYSSLV2 ABYSSLV3 ABYSSLV4; do test -s bin/$f.8xv; done
          ls -l bin/

      - uses: actions/upload-artifact@v4
        with:
          name: ABYSS-send-all-to-calculator
          path: |
            abyss/bin/ABYSS.8xp
            abyss/bin/*.8xv
          if-no-files-found: error
